<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="13.40cm" viewBox="0 0 900 754"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect width="900" height="754" fill="white"/><line x1="150" y1="30" x2="150" y2="712" stroke="#94A3B8" stroke-width="3"/><text x="130" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">22–25/09</text><circle cx="150" cy="30" r="9" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="175" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#6D28D9">fotomac-lab</text><text x="175" y="48" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Teste 1: 5 tecnologias comparadas em 388 fotos; InsightFace vence (97,6).</text><text x="130" y="97" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">01/10</text><circle cx="150" cy="92" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="90" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 1 — a base</text><text x="175" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Banco, adaptador facial, SeaweedFS e o padrão de portas e adaptadores.</text><text x="130" y="159" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">03/10</text><circle cx="150" cy="154" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="152" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 2a — login</text><text x="175" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Contas por convite, primeiro acesso, recuperação de senha, bloqueio.</text><text x="130" y="221" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">03/10</text><circle cx="150" cy="216" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 2b — fotógrafo</text><text x="175" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Eventos, envio em lote, conferência, publicação, fila facial, ZIP.</text><text x="130" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">03/10</text><circle cx="150" cy="278" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 3 — visitante</text><text x="175" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Página pública, “Estou ciente”, busca pelo rosto, download, remoção.</text><text x="130" y="345" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">04/10</text><circle cx="150" cy="340" r="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="175" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#B45309">Correções suas</text><text x="175" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Resultado some ao sair; download e ZIP presos à sessão.</text><text x="130" y="407" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">04/10</text><circle cx="150" cy="402" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 4a — contas</text><text x="175" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Administrador cria, edita, suspende e desbloqueia contas.</text><text x="130" y="469" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">04/10</text><circle cx="150" cy="464" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="462" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Etapa 4b — configuração</text><text x="175" y="482" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Temas, parâmetros do reconhecimento, reindexação, expiração.</text><text x="130" y="531" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">15–16/10</text><circle cx="150" cy="526" r="9" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="175" y="524" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#6D28D9">Pós 1ª banca</text><text x="175" y="544" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">CESMAC escolhe YuNet + SFace (licença sem custo); troca pelo painel.</text><text x="130" y="593" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">16–17/10</text><circle cx="150" cy="588" r="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="175" y="586" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#B45309">Requisitos 2.0</text><text x="175" y="606" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Teste de precisão, temas do fotógrafo, borrão de criança, novos perfis.</text><text x="130" y="655" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">17/10</text><circle cx="150" cy="650" r="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="175" y="648" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1D4ED8">Produção v2.0</text><text x="175" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Captura guiada com prova de vida, marketing, contratado, exclusão, sino.</text><text x="130" y="717" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#64748B">próximo</text><circle cx="150" cy="712" r="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 3"/><text x="175" y="710" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" text-anchor="start" fill="#64748B">Fases 9 a 13</text><text x="175" y="730" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1E293B">Pessoas institucionais, vídeo, marca d'água, aplicativo, implantação.</text></svg>