<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="5.69cm" viewBox="0 0 900 320"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect width="900" height="320" fill="white"/><rect x="30" y="40" width="190" height="80" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="125.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1D4ED8">1. Indexar</text><text x="125.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">a próxima foto</text><text x="125.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">publicada pendente</text><path d="M220 80 L258 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="260" y="40" width="190" height="80" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="355.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1D4ED8">2. Montar ZIP</text><text x="355.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">o próximo pacote</text><text x="355.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">pedido pelo fotógrafo</text><path d="M450 80 L488 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="490" y="40" width="190" height="80" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="585.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1D4ED8">3. Reindexar</text><text x="585.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">só se 1 e 2</text><text x="585.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">estão ociosos</text><rect x="720" y="40" width="160" height="80" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="800.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#64748B">Ocioso?</text><text x="800.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">espera 1 s</text><text x="800.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">e recomeça</text><path d="M680 80 L718 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><path d="M800 40 L800 16 L125 16 L125 38" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><text x="460" y="12" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#64748B">repete para sempre, enquanto a API estiver ligada</text><rect x="30" y="165" width="850" height="112" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="455.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#B45309">A cada 60 segundos, faxina</text><text x="455.0" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1E293B">apaga pacotes ZIP vencidos (60 min)  ·  exclui fotos com pedido de remoção há 72 h</text><text x="455.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1E293B">avisa por e-mail os eventos que expiram em 30 dias  ·  elimina os eventos vencidos</text><text x="455.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1E293B">(fotos, cópias, capa, pacotes e vetores — arquivos primeiro, registros depois)</text><text x="450" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#64748B" font-style="italic">A fila é o próprio banco: SELECT … FOR UPDATE SKIP LOCKED — dois trabalhadores nunca pegam a mesma foto.</text></svg>