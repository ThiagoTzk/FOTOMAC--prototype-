<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="14.22cm" viewBox="0 0 900 800"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect width="900" height="800" fill="white"/><rect x="15" y="10" width="130" height="40" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="80.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">Navegador</text><line x1="80" y1="50" x2="80" y2="790" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="275" y="10" width="130" height="40" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="340.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1D4ED8">API Python</text><line x1="340" y1="50" x2="340" y2="790" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="455" y="10" width="130" height="40" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="520.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6D28D9">InsightFace</text><line x1="520" y1="50" x2="520" y2="790" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="615" y="10" width="130" height="40" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/><text x="680.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">PostgreSQL</text><line x1="680" y1="50" x2="680" y2="790" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="765" y="10" width="130" height="40" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="830.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#B45309">SeaweedFS</text><line x1="830" y1="50" x2="830" y2="790" stroke="#94A3B8" stroke-dasharray="4 4"/><path d="M80 90 L336 90" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="96.7" y="70.5" width="226.6" height="17.5" fill="white"/><text x="210.0" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">1. “Estou ciente” (POST /consent)</text><path d="M340 120 L676 120" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="390.1" y="100.5" width="239.9" height="17.5" fill="white"/><text x="510.0" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">registra a ciência + sessão anônima</text><path d="M340 150 L84 150" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="116.6" y="130.5" width="186.9" height="17.5" fill="white"/><text x="210.0" y="143" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">cookie da sessão (HttpOnly)</text><path d="M80 200 L336 200" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="100.0" y="180.5" width="220.0" height="17.5" fill="white"/><text x="210.0" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">2. selfie em JPEG (POST /search)</text><path d="M340 235 L516 235" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="369.7" y="215.5" width="120.6" height="17.5" fill="white"/><text x="430.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">3. detect(selfie)</text><path d="M520 265 L344 265" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="353.1" y="245.5" width="153.8" height="17.5" fill="white"/><text x="430.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">rostos + vetores (512)</text><path d="M340 290 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="291.5" width="193.5" height="17.5" fill="white"/><text x="378" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">4. escolhe UM rosto: o maior</text><path d="M340 345 L676 345" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="360.2" y="325.5" width="299.5" height="17.5" fill="white"/><text x="510.0" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">5. vetores do evento com similaridade ≥ 0,30</text><path d="M680 375 L344 375" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="376.8" y="355.5" width="266.4" height="17.5" fill="white"/><text x="510.0" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">ids das fotos, da mais parecida à menos</text><path d="M340 400 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="401.5" width="233.2" height="17.5" fill="white"/><text x="378" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">6. apaga selfie e vetor da memória</text><path d="M340 440 L676 440" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="419.9" y="420.5" width="180.2" height="17.5" fill="white"/><text x="510.0" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">guarda só os ids na sessão</text><path d="M340 470 L84 470" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="143.1" y="450.5" width="133.9" height="17.5" fill="white"/><text x="210.0" y="463" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">lista de resultados</text><path d="M80 525 L336 525" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="83.4" y="505.5" width="253.1" height="17.5" fill="white"/><text x="210.0" y="518" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">7. miniatura (GET /images/{id}/thumb)</text><path d="M340 545 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="546.5" width="220.0" height="17.5" fill="white"/><text x="378" y="559" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">confere: o id está NESTA sessão?</text><path d="M340 590 L826 590" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="531.3" y="570.5" width="107.4" height="17.5" fill="white"/><text x="585.0" y="583" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">busca o arquivo</text><path d="M830 620 L344 620" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="521.4" y="600.5" width="127.2" height="17.5" fill="white"/><text x="585.0" y="613" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">bytes da miniatura</text><path d="M340 650 L84 650" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="146.4" y="630.5" width="127.2" height="17.5" fill="white"/><text x="210.0" y="643" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">imagem (sem cache)</text><path d="M80 700 L336 700" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="96.7" y="680.5" width="226.6" height="17.5" fill="white"/><text x="210.0" y="693" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">8. Baixar → link assinado, 15 min</text><path d="M340 735 L826 735" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="484.9" y="715.5" width="200.1" height="17.5" fill="white"/><text x="585.0" y="728" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">arquivo original com créditos</text><path d="M340 765 L84 765" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="179.5" y="745.5" width="61.0" height="17.5" fill="white"/><text x="210.0" y="758" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">download</text></svg>