<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="15.29cm" viewBox="0 0 900 860"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect width="900" height="860" fill="white"/><rect x="15" y="10" width="130" height="40" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="80.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">Navegador</text><line x1="80" y1="50" x2="80" y2="850" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="275" y="10" width="130" height="40" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="340.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1D4ED8">API Python</text><line x1="340" y1="50" x2="340" y2="850" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="455" y="10" width="130" height="40" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="520.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6D28D9">YuNet + SFace</text><line x1="520" y1="50" x2="520" y2="850" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="615" y="10" width="130" height="40" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/><text x="680.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">PostgreSQL</text><line x1="680" y1="50" x2="680" y2="850" stroke="#94A3B8" stroke-dasharray="4 4"/><rect x="765" y="10" width="130" height="40" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="830.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#B45309">SeaweedFS</text><line x1="830" y1="50" x2="830" y2="850" stroke="#94A3B8" stroke-dasharray="4 4"/><path d="M80 90 L336 90" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="96.7" y="70.5" width="226.6" height="17.5" fill="white"/><text x="210.0" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">1. “Estou ciente” (POST /consent)</text><path d="M340 118 L676 118" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="390.1" y="98.5" width="239.9" height="17.5" fill="white"/><text x="510.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">registra a ciência + sessão anônima</text><path d="M340 146 L84 146" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="116.6" y="126.5" width="186.9" height="17.5" fill="white"/><text x="210.0" y="139" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">cookie da sessão (HttpOnly)</text><path d="M80 190 L336 190" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="103.3" y="170.5" width="213.4" height="17.5" fill="white"/><text x="210.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">2. pede a ordem (POST /capture)</text><path d="M340 206 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="207.5" width="220.0" height="17.5" fill="white"/><text x="378" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">sorteia a ordem dos 4 movimentos</text><path d="M340 244 L84 244" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="93.4" y="224.5" width="233.2" height="17.5" fill="white"/><text x="210.0" y="237" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">ordem sorteada (vale 1 vez, 2 min)</text><path d="M80 290 L336 290" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="86.8" y="270.5" width="246.5" height="17.5" fill="white"/><text x="210.0" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">3. quadros da captura (POST /search)</text><path d="M340 320 L516 320" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="353.1" y="300.5" width="153.8" height="17.5" fill="white"/><text x="430.0" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">4. detect(cada quadro)</text><path d="M520 348 L344 348" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="346.5" y="328.5" width="167.0" height="17.5" fill="white"/><text x="430.0" y="341" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">rostos, pontos e vetores</text><path d="M340 370 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="371.5" width="226.6" height="17.5" fill="white"/><text x="378" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">5. prova de vida: giros na ordem?</text><path d="M340 400 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="401.5" width="213.4" height="17.5" fill="white"/><text x="378" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">mesma pessoa em todas as poses?</text><path d="M340 450 L676 450" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="363.6" y="430.5" width="292.9" height="17.5" fill="white"/><text x="510.0" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">6. vetores do evento ≥ 0,3741 (melhor pose)</text><path d="M680 478 L344 478" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="376.8" y="458.5" width="266.4" height="17.5" fill="white"/><text x="510.0" y="471" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">ids das fotos, da mais parecida à menos</text><path d="M340 500 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="501.5" width="253.1" height="17.5" fill="white"/><text x="378" y="514" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">7. apaga quadros e vetores da memória</text><path d="M340 538 L676 538" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="419.9" y="518.5" width="180.2" height="17.5" fill="white"/><text x="510.0" y="531" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">guarda só os ids na sessão</text><path d="M340 566 L84 566" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="143.1" y="546.5" width="133.9" height="17.5" fill="white"/><text x="210.0" y="559" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">lista de resultados</text><path d="M80 612 L336 612" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="83.4" y="592.5" width="253.1" height="17.5" fill="white"/><text x="210.0" y="605" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">8. miniatura (GET /images/{id}/thumb)</text><path d="M340 630 h30 v18 h-28" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="374.0" y="631.5" width="220.0" height="17.5" fill="white"/><text x="378" y="644" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1E293B">confere: o id está NESTA sessão?</text><path d="M340 670 L826 670" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="531.3" y="650.5" width="107.4" height="17.5" fill="white"/><text x="585.0" y="663" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">busca o arquivo</text><path d="M830 698 L344 698" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="521.4" y="678.5" width="127.2" height="17.5" fill="white"/><text x="585.0" y="691" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">bytes da miniatura</text><path d="M340 726 L84 726" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="146.4" y="706.5" width="127.2" height="17.5" fill="white"/><text x="210.0" y="719" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">imagem (sem cache)</text><path d="M80 770 L336 770" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="96.7" y="750.5" width="226.6" height="17.5" fill="white"/><text x="210.0" y="763" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">9. Baixar → link assinado, 15 min</text><path d="M340 800 L826 800" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="484.9" y="780.5" width="200.1" height="17.5" fill="white"/><text x="585.0" y="793" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">arquivo original com créditos</text><path d="M340 830 L84 830" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/><rect x="179.5" y="810.5" width="61.0" height="17.5" fill="white"/><text x="210.0" y="823" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">download</text></svg>