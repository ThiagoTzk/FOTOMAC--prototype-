<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="5.51cm" viewBox="0 0 900 310"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect width="900" height="310" fill="white"/><rect x="10" y="20" width="152" height="120" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="86.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">1. Imagem</text><text x="86.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">foto do evento</text><text x="86.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">ou quadro da captura</text><path d="M162 80 L186 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="187" y="20" width="152" height="120" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="263.0" y="57.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6D28D9">2. Detecção</text><text x="263.0" y="78.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">YuNet</text><text x="263.0" y="96.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">foto ≤ 1920 px</text><text x="263.0" y="115.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">caixa + confiança</text><path d="M339 80 L363 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="364" y="20" width="152" height="120" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="440.0" y="57.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6D28D9">3. Alinhamento</text><text x="440.0" y="78.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">recorte 112×112</text><text x="440.0" y="96.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">olhos no lugar</text><text x="440.0" y="115.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">(5 pontos)</text><path d="M516 80 L540 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="541" y="20" width="152" height="120" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="617.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6D28D9">4. Reconhecimento</text><text x="617.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">SFace</text><text x="617.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">(OpenCV)</text><path d="M693 80 L717 80" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><rect x="718" y="20" width="152" height="120" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/><text x="794.0" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">5. Vetor</text><text x="794.0" y="87.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">128 números</text><text x="794.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">normalizado</text><rect x="110" y="200" width="330" height="96" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/><text x="275.0" y="225.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">Foto publicada do evento</text><text x="275.0" y="246.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">vetor GUARDADO no PostgreSQL</text><text x="275.0" y="264.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">(tabela face_embeddings)</text><text x="275.0" y="283.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">uma linha por rosto da foto</text><rect x="480" y="200" width="330" height="96" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="645.0" y="225.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#B91C1C">Captura do visitante</text><text x="645.0" y="246.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">vetores só na MEMÓRIA, comparados</text><text x="645.0" y="264.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">e descartados no fim da busca</text><text x="645.0" y="283.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1E293B">nunca vão para disco ou banco</text><path d="M794.0 140 L794.0 165 L275 165 L275 198" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/><path d="M794.0 165 L645 165 L645 198" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/></svg>